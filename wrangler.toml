name = "reframe-houses"
main = "worker.js"
compatibility_date = "2024-11-01"

# This Worker is the API backend (POST /api/lead → monday.com) and also serves
# the static site from ./docs as a fallback at the *.workers.dev URL.
# The primary site is served on reframehouses.com via GitHub Pages (same ./docs).
[assets]
directory = "./docs"
binding = "ASSETS"

# Secret (set in the dashboard, not here): MONDAY_TOKEN.
