name = "reframe-houses1"
main = "worker.js"
compatibility_date = "2024-11-01"

# Static site lives in ./public and is served via the ASSETS binding.
# The Worker (worker.js) only handles POST /api/lead; all other requests fall
# through to the static assets.
[assets]
directory = "./public"
binding = "ASSETS"

# Secrets are NOT stored here. Set the monday.com token with:
#   wrangler secret put MONDAY_TOKEN
# ...or in the dashboard: the Worker → Settings → Variables and Secrets.
